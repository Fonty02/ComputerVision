# ------ Hyperparamters ------
search_hp: True

search_scale: [7, 5,3, 1]
search_step: [200, 20, 20]

init_beta: 1
init_alpha: 3
init_gamma: 0.1

eps: 0.001
training_feat_num: 700
training_free_feat_num: 400

w_training_free: [0.5, 0.5]
w_training: [0.2, 0.8]
 
# ------ Basic Config ------
dataset: 'artgraph'
backbone: 'RN50'

lr: 0.001
augment_epoch: 10
train_epoch: 20

# ArtGraph configuration for TIMO using artists as classes

# Specify the maximum number of shots for support extraction 
# (deve essere minore o uguale al numero di esempi nel test set per ogni artista)
max_support_perclass: 16

